[thermistor bed_thermistor]
temperature1:25
resistance1:100000
temperature2:50
resistance2:18085.4
temperature3:100
resistance3:5362.6

[heater_bed]
heater_pin:PA0
sensor_type: bed_thermistor  
sensor_pin: PC5
max_power: 1.0               
min_temp: 5                  
max_temp: 105                
control : pid
pid_kp : 73.571
pid_ki : 1.820
pid_kd : 783.849
pwm_cycle_time: 0.0167

[verify_heater heater_bed]      
max_error: 120                
check_gain_time:120          
hysteresis: 5                
heating_gain: 2 

[bed_mesh]
speed: 500                   
horizontal_move_z: 5         
mesh_min: 10,10              
mesh_max: 333,340            
probe_count: 9,9             
algorithm: bicubic   
bicubic_tension: 0.4
split_delta_z: 0.016
mesh_pps:3,3
adaptive_margin: 5
fade_start: 0
fade_end: 10
fade_target: 0

# [probe_pressure]
# pin: ^!PE12     
# x_offset: 0                  
# y_offset: 0
# z_offset : 0
# speed: 1.0

[quad_gantry_level]          
gantry_corners:              
	-60,-10
	410,420
points:
	35,35
	35,315
	315,315
	315,35
speed: 400                   
horizontal_move_z: 3       
retry_tolerance: 0.05      
retries: 5                  
max_adjust: 30   

# MCU fan, aka noisy boi, is now only enabled when using steppers, extruder, heatbed; 5min timeout
[controller_fan MCU_fan]
pin: PA1
max_power: 1
kick_start_time: 0.5
fan_speed: 1
idle_timeout: 300
heater: heater_bed #, extruder
stepper: stepper_x, stepper_y

[controller_fan electronics_fan] # exhaust fan
pin: PA2
heater: heater_bed
idle_timeout: 20

# Want your fan (host) temperature controlled? Uncomment the next section and comment out the above section, derived from: https://www.reddit.com/r/Sovol/comments/1cqntzu/first_mod_on_my_sv08_noctua_fan_for_the/
