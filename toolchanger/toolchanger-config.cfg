# THIS IS NOT AN EXHAUSTIVE LIST!
# use this file to override values in the other configs. 
# any value that is available in the configs can be overriden here
# just add the section ie: [tool_probe T0] and the value that is being overridden.  

# this file must be the last file to be included since values will be stored in the order they are
# received.  Klipper will take the last value and store that for the macros. 

[rounded_path]
resolution: 0.2 # the length of a circle approximation segments.
replace_g0: False # Use at your own risk

[force_move]
enable_force_move: True

[toolchanger]
params_dropoff_path: [{'y':16, 'z':10}, {'z':0, 'y':0, 'f':0.5},{'z':-10, 'y':0},{'z':-10, 'y':16}]
params_pickup_path: [{'z':-10, 'y':16}, {'z':-10, 'y':0}, {'z':0, 'y':0, 'f':0.5}, {'y':0, 'z':5, 'verify':1}, {'y':16, 'z':5}]
params_safe_y: 120
params_close_y: 30
params_fast_speed: 30000 
params_path_speed: 6000 

# this section must be completed
[gcode_macro homing_override_config]
variable_sensorless_x: True
variable_sensorless_y: True
variable_homing_rebound_y: 175 # for sensorless you probably want this set to 20.
variable_stepper_driver: "tmc2209"
variable_homing_current: 0.49

# M109 macro is overridden to allow some deadband on the temp
# default is +- 1 degree.  So if the set temp is 250 the the default
# deadband will be 249-251.  You can adjust this here:

[gcode_macro SET_TEMPERATURE_WITH_DEADBAND]
variable_default_deadband: 4.0

[gcode_macro _CALIBRATION_SWITCH]
variable_x: 315
variable_y: 348.8
variable_z: 52
gcode:

[tools_calibrate]
pin: ^PE12
travel_speed: 20  # mms to travel sideways for XY probing
spread: 3  # mms to travel down from top for XY probingS
lower_z: 0.25 # The speed (in mm/sec) to move tools down onto the probe
speed: 2  # The speed (in mm/sec) to retract between probes


[gcode_macro TOP_Z_RECOVER]
gcode:
  SET_KINEMATIC_POSITION Z=300
  G90
  G1 Z10 F12000
  G28


[gcode_macro INSERT_LOAD_FILAMENT]
gcode:
  {% set tn = params.T|default(0)|int %}  
  {% set extSensor = printer['filament_switch_sensor extruder_sensor_T' + tn|string] %}
  {% set maxInitialLoadTry = 45|int %}
  
  {% set extMotor  = 'extruder' %}
  {% if tn > 0 %}
    {% set extMotor = extMotor + tn|string %}
  {% endif %}

  # Load Extruder
  {% for x in range(1, maxInitialLoadTry) %}
    {% if extSensor is not defined or extSensor.filament_detected == false %}
      FORCE_MOVE STEPPER={extMotor} DISTANCE=1 VELOCITY=5
    {% endif %}
  {% endfor %}

  {% if printer.print_stats.state != "printing" %}
    {% if printer.quad_gantry_level.applied == False %}
      G32
    {% endif %}

    # Load Hotend
    SELECT_TOOL T={tn}
    SET_TEMPERATURE_WITH_DEADBAND T={tn} S=250
    LOAD_FILAMENT
    SET_TEMPERATURE_WITH_DEADBAND T={tn} S=0
  {% endif %}
