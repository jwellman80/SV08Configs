[gcode_macro NOZZLE_SEAL]
variable_center_x: 327
variable_center_y: 4
variable_x_amount: 5
variable_y_amount: 4
variable_move_speed: 100
gcode:
    
    {% set TEMP = params.TEMP | default(250) | int %}
    {% set MIN_TEMP = params.MIN_TEMP | default(150) | int %}
    G90
    BLOBIFIER_PARK
    M109 S{TEMP}

    BLOBIFIER_CLEAN
    G0 X{center_x - (x_amount / 2)} Y{center_y - (y_amount / 2)} Z5 F18000
    PROBE SAMPLES=1

    M104 S150

    {% for _ in range(1, 15) %}
      _NOZZLE_SEAL MIN_TEMP={MIN_TEMP}
    {% endfor %}
    
    G91
    G0 Z5 F1000
    
    G90
    G0 Z10 F1000
    

[gcode_macro _NOZZLE_SEAL]
gcode: 
  {% set MIN_TEMP = params.MIN_TEMP | default(155) | int %}
  {% set ns = printer['gcode_macro NOZZLE_SEAL'] %}
  {% if printer.extruder.temperature >= ( MIN_TEMP + 5 ) %}
    G91
    G0 X{ns.x_amount} F{ns.move_speed}
    G0 Y{ns.y_amount} F{ns.move_speed}
    G0 X{ns.x_amount * -1} F{ns.move_speed}
    G0 Y{ns.y_amount * -1} F{ns.move_speed}
  {% endif%}